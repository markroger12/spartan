config-version: 1
# Applies to confirmed Bedrock and conservative UNKNOWN identities.
# SUPPORTED means the normalized predicate can be reused diagnostically, not native-client certification.
# ADJUSTED limit = base limit / sensitivity-multiplier + extra-tolerance.
# A multiplier below 1 is less sensitive; 0.5 doubles the limit.
mode: observe-only
capture-translated-history: true
history-size: 16
history-max-age-ms: 5000
checks:
  SpeedA:
    mode: BEDROCK_DISABLED
    sensitivity-multiplier: 1.0
    extra-tolerance: 0.0
