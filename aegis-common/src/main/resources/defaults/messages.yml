config-version: 1
# Legacy & color codes are supported. Text is plain chat, never executed as commands.
# Placeholders depend on the command; unknown placeholders remain literal.
messages:
  prefix: '&8[&bAegisAC&8] &r'
  help: '&b/ac help | version | reload | profile <player> | connection <player> | physics <player> | checks | movement <player> | safeposition <player> | combat <player> | cps <player> | inspect <player> [category] | edition <player> | bedrock <player> | alerts | verbose | violations <player> | logs <player-or-uuid> | panic | output | performance'
  denied: '&cYou do not have permission to use this command.'
  unknown-command: '&cUnknown command. Use /ac help.'
  version: '&bAegisAC %version% — Phase 10 scheduler hardening; Folia runtime support remains gated.'
  reloading: '&7Validating configuration...'
  reload-success: '&aConfiguration generation %generation% loaded.'
  reload-failed: '&cReload rejected: %error%. Previous settings remain active.'
  reload-busy: '&eA reload is already running. Try again after it finishes.'
  profile-usage: '&eUsage: /ac profile <online-player>'
  player-missing: '&cThat player has no active AegisAC session.'
  profile: '&b%player% &7(%uuid%) client=%client% identity=%bedrock% inbound=%inbound% outbound=%outbound%'
  connection-usage: '&eUsage: /ac connection <online-player>'
  # RTT=-1 means unavailable, not zero latency. Brand is client-reported, never trusted identity.
  connection: '&b%player% &7transaction=%transaction_rtt%ms keepalive=%keepalive_rtt%ms jitter=%jitter%ms pending=%pending% uncertain=%uncertain% loss=%loss_epoch% brand=%brand%'
  performance: '&7Check evaluations=%check_evaluations% movement-eval-avg=%movement_eval_us%us analysis-batches=%analysis_batches% analysis-avg=%analysis_us%us debug-drops=%debug_dropped% Players=%players% inbound=%inbound% outbound=%outbound% untracked=%untracked% processed=%processed% queued=%queued% dropped=%dropped% decode-rejected=%decode_rejected% failures=%failures% executor-rejected=%executor_rejected% captures=%captures% capture-failures=%capture_failures% generation=%generation%'
  physics-usage: '&eUsage: /ac physics <online-player>'
  # Residual=-1 means no comparison; residual is not a violation or an enforcement threshold.
  physics: '&b%player% &7model=%model% candidates=%candidates% residual=%residual% uncertainty=%uncertainty% (diagnostic only)'
  check-entry: '&b%check% &7%status% bedrock=%bedrock%: %description%'
  movement-usage: '&eUsage: /ac %command% <online-player>'
  movement-summary: '&b%player% &7generation=%generation% experimental-findings=%findings% diagnostics=%diagnostics%: %states%'
  movement-evidence: '&7Latest: %check% sequence=%sequence% diagnostic=%diagnostic% excess=%excess% reasons=%reasons%'
  safe-unavailable: '&7%player% has no current safe-position candidate.'
  safe-position: '&b%player% &7candidate=%x%,%y%,%z% verified=%verified% trusted-samples=%samples% reasons=%reasons% (no setback performed)'
  combat-summary: '&b%player% &7generation=%generation% attacks=%attacks% swings=%swings% targets=%targets%: %states% (diagnostic only)'
  cps-summary: '&b%player% &7observed swing rate=%rate%/s interval variation=%variation% (packet timing, not physical clicks)'
  inspect-usage: '&eUsage: /ac inspect <online-player> [all|world|player|inventory|protocol|exploit]'
  guard-summary: '&b%player% &7%category% generation=%generation%: %states% (diagnostic only)'
  guard-evidence: '&7Latest: %check% sequence=%sequence% observed=%observed% limit=%limit% reasons=%reasons% (diagnostic only)'
  edition-summary: '&b%player% &7edition=%edition% source=%source% device=%device% input=%input% version=%version% reasons=%reasons%'
  bedrock-summary: '&b%player% &7%status% histories: %histories% reasons=%reasons% (translated observations only)'
  player-command: '&eThis command requires a player session.'
  output-toggle: '&7%channel% subscription=%enabled%'
  output-busy: '&eOutput queue or subscription capacity reached.'
  panic: '&ePanic=%enabled%. When true, automatic punishments and configured setbacks are blocked; detection and logging continue.'
  output-status: '&7Panic=%panic% output=%metrics%'
  violations: '&b%player% &7risk=%risk% confidence=%confidence% findings=%findings% VL=%checks% (policy scores, not proof)'
  logs-queued: '&7SQLite log query queued.'
  logs-result: '&7Recent SQLite records=%count% (maximum 10; empty if unavailable or disabled).'
  log-line: '&7%record%'
  admin-result: '&7%result%'
  admin-help: '&7Available: %commands%. /ac gui [player] opens menus; /ac toggle <check>; /ac reset|debug|unfreeze <player>; /ac freeze <player> [time]; /ac exempt|bypass <player> <check|*> <time>; /ac top'
  profile-detail: '&b%label%: &7%value%'
