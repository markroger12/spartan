name: AegisAC
version: '${version}'
main: dev.aegisac.paper.AegisPlugin
api-version: '1.21'
description: Original anti-cheat foundation. Phase 10 scheduler hardening; Folia runtime support remains gated.
author: AegisAC contributors
# PacketEvents is supplied as a separate plugin; never bundled or initialized twice.
depend: [packetevents]
softdepend: [floodgate, Geyser-Spigot, ViaVersion, ViaBackwards]
# No folia-supported flag: service ownership migration and independent live validation remain required.
commands:
  ac:
    description: AegisAC administration
    aliases: [aegisac]
    usage: /ac help
permissions:
  aegisac.admin:
    description: All administrative commands
    default: op
    children:
      aegisac.help: true
      aegisac.version: true
      aegisac.reload: true
      aegisac.profile: true
      aegisac.performance: true
      aegisac.connection: true
      aegisac.physics: true
      aegisac.checks: true
      aegisac.movement: true
      aegisac.safeposition: true
      aegisac.combat: true
      aegisac.cps: true
      aegisac.inspect: true
      aegisac.edition: true
      aegisac.bedrock: true
      aegisac.alerts: true
      aegisac.verbose: true
      aegisac.violations: true
      aegisac.logs: true
      aegisac.panic: true
      aegisac.output: true
      aegisac.debug: true
      aegisac.toggle: true
      aegisac.reset: true
      aegisac.exempt: true
      aegisac.bypass.manage: true
      aegisac.freeze: true
      aegisac.unfreeze: true
      aegisac.top: true
      aegisac.gui: true
      aegisac.punishment: true
      aegisac.profile.set: true
